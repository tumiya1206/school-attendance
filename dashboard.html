<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行政晨間點名儀表板與月總表匯出</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 注意：請替換成你原本 Firebase 的配置資訊
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 預設月份為當月份 YYYY-MM
    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date();
      const currentMonth = today.toISOString().substring(0, 7);
      document.getElementById('monthPicker').value = currentMonth;
      loadDailySummary();
    });

    // 讀取當天儀表板
    window.loadDailySummary = async function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('todayDateStr').innerText = today;

      const q = query(collection(db, "attendance"), where("date", "==", today));
      const querySnapshot = await getDocs(q);

      const listEl = document.getElementById('dailyList');
      listEl.innerHTML = '';

      if (querySnapshot.empty) {
        listEl.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-slate-400">今日尚無任何班級回報紀錄</td></tr>';
        return;
      }

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const row = document.createElement('tr');
        row.className = 'border-b hover:bg-slate-50';
        row.innerHTML = `
          <td class="p-3 font-bold text-slate-800">${data.className}</td>
          <td class="p-3 text-slate-600">${data.totalStudents} 人</td>
          <td class="p-3 text-red-600 font-medium">${data.absentInfo || '無（全員到齊）'}</td>
        `;
        listEl.appendChild(row);
      });
    };

    // 匯出指定月份 CSV Excel 總表
    window.exportMonthlyCSV = async function() {
      const selectedMonth = document.getElementById('monthPicker').value;
      if (!selectedMonth) {
        alert('請選擇匯出月份！');
        return;
      }

      const q = query(collection(db, "attendance"), where("month", "==", selectedMonth));
      const querySnapshot = await getDocs(q);

      if (querySnapshot.empty) {
        alert(`找不到 ${selectedMonth} 月份的點名紀錄！`);
        return;
      }

      // 製作 CSV 內容 (加上 \uFEFF 解決 Excel 中文亂碼)
      let csvContent = "\uFEFF日期,班級,應到人數,缺席與請假狀況\n";

      let records = [];
      querySnapshot.forEach((doc) => {
        records.push(doc.data());
      });

      // 依日期與班級排序
      records.sort((a, b) => a.date.localeCompare(b.date) || a.className.localeCompare(b.className));

      records.forEach(r => {
        const cleanAbsent = (r.absentInfo || '無').replace(/"/g, '""');
        csvContent += `"${r.date}","${r.className}","${r.totalStudents}","${cleanAbsent}"\n`;
      });

      // 觸發下載檔案
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      link.setAttribute("download", `${selectedMonth}_全校點名紀錄總表.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };
  </script>
</head>
<body class="bg-slate-100 p-6 font-sans max-w-4xl mx-auto">
  <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200 mb-6">
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">行政晨間點名即時儀表板</h1>
        <p class="text-slate-500">今日日期：<span id="todayDateStr" class="font-bold text-blue-600"></span></p>
      </div>
      
      <!-- 月份選擇與匯出區 -->
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex items-center gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">選擇匯出月份</label>
          <input type="month" id="monthPicker" class="p-2 border border-slate-300 rounded-lg text-sm">
        </div>
        <button onclick="exportMonthlyCSV()" class="mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-sm shadow transition">
          📊 匯出單月 Excel 總表
        </button>
      </div>
    </div>

    <!-- 今日即時紀錄 -->
    <h2 class="text-lg font-bold text-slate-700 mb-3">今日各班回報狀態</h2>
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-100 text-slate-600 border-b">
            <th class="p-3">班級</th>
            <th class="p-3">應到人數</th>
            <th class="p-3">缺席及原因</th>
          </tr>
        </thead>
        <tbody id="dailyList">
          <!-- 動態載入資料 -->
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
