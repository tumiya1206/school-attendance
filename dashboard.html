<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>屏東市民生國小出缺勤行政管理後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <!-- 引入 SheetJS 用於匯出 Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- 頂部標題與匯出按鈕 -->
    <div class="bg-white rounded-2xl shadow-xl p-6 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <img src="https://www.msps.ptc.edu.tw/uploads/1711081122959z3rux6p2.png" alt="校徽" class="w-12 h-12 object-contain">
        <div>
          <h1 class="text-2xl font-bold text-gray-800">屏東市民生國小 - 出缺勤行政管理後台</h1>
          <p class="text-xs text-gray-500">當日即時缺勤名單與歷史數據統計</p>
        </div>
      </div>
      <button onclick="exportToExcel()" class="bg-green-600 hover:bg-green-700 text-white font-bold px-5 py-2.5 rounded-xl shadow flex items-center gap-2">
        📊 匯出月報表 (Excel)
      </button>
    </div>

    <!-- 📌 當天全校各班出缺勤即時卡片區 -->
    <div class="bg-white rounded-2xl shadow-xl p-6 border-l-4 border-blue-600">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
          📅 今日各班缺勤即時概況 <span id="todayDateStr" class="text-sm font-normal text-blue-600"></span>
        </h2>
        <button onclick="loadTodayData()" class="text-xs bg-blue-50 text-blue-600 hover:bg-blue-100 font-semibold px-3 py-1.5 rounded-lg border border-blue-200">
          🔄 重新整理今日
        </button>
      </div>

      <!-- 統計數據小卡 -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-blue-50 border border-blue-100 p-3.5 rounded-xl text-center">
          <p class="text-xs text-blue-600 font-bold mb-1">應點名班級</p>
          <p id="statTotalClasses" class="text-2xl font-black text-blue-800">9</p>
        </div>
        <div class="bg-green-50 border border-green-100 p-3.5 rounded-xl text-center">
          <p class="text-xs text-green-600 font-bold mb-1">已點名班級</p>
          <p id="statDoneClasses" class="text-2xl font-black text-green-800">0</p>
        </div>
        <div class="bg-yellow-50 border border-yellow-100 p-3.5 rounded-xl text-center">
          <p class="text-xs text-yellow-600 font-bold mb-1">未點名班級</p>
          <p id="statUndoneClasses" class="text-2xl font-black text-yellow-800">9</p>
        </div>
        <div class="bg-red-50 border border-red-100 p-3.5 rounded-xl text-center">
          <p class="text-xs text-red-600 font-bold mb-1">今日全校缺席人數</p>
          <p id="statTodayAbsent" class="text-2xl font-black text-red-800">0</p>
        </div>
      </div>

      <!-- 各班即時動態卡片區 -->
      <div id="todayClassCards" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <p class="text-xs text-gray-400 col-span-3 text-center py-4">資料載入中...</p>
      </div>
    </div>

    <!-- 🔍 月份歷史查詢與表格區 -->
    <div class="bg-white rounded-2xl shadow-xl p-6">
      <h2 class="text-lg font-bold text-gray-800 mb-4">🔍 歷史出缺勤明細查詢</h2>
      
      <!-- 篩選器條件區 -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 bg-gray-50 p-4 rounded-xl border border-gray-200">
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">📅 查詢月份</label>
          <input type="month" id="monthFilter" onchange="loadData()" class="w-full p-2.5 border rounded-lg bg-white text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">🏫 班級篩選</label>
          <select id="classFilter" onchange="loadData()" class="w-full p-2.5 border rounded-lg bg-white text-sm outline-none focus:ring-2 focus:ring-blue-500">
            <option value="ALL">全部班級</option>
            <option value="一年一班">一年一班</option>
            <option value="二年一班">二年一班</option>
            <option value="三年一班">三年一班</option>
            <option value="四年一班">四年一班</option>
            <option value="四年二班">四年二班</option>
            <option value="五年一班">五年一班</option>
            <option value="五年二班">五年二班</option>
            <option value="六年一班">六年一班</option>
            <option value="六年二班">六年二班</option>
          </select>
        </div>
        <div class="flex items-end">
          <button onclick="loadData()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg shadow">
            🔍 查詢紀錄
          </button>
        </div>
      </div>

      <!-- 資料表格 -->
      <div class="overflow-x-auto rounded-xl border border-gray-200 shadow-sm">
        <table class="w-full text-left text-sm text-gray-600">
          <thead class="bg-gray-100 text-gray-700 font-bold uppercase text-xs border-b">
            <tr>
              <th class="p-3">日期</th>
              <th class="p-3">班級</th>
              <th class="p-3 text-center">應到</th>
              <th class="p-3 text-center">實到</th>
              <th class="p-3 text-center">缺席</th>
              <th class="p-3">缺席詳細名單與節次</th>
            </tr>
          </thead>
          <tbody id="attendanceTbody" class="divide-y divide-gray-200">
            <tr>
              <td colspan="6" class="p-4 text-center text-gray-400">請選擇月份以載入資料...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBqdSFkDkjka6hewD9hEfY39KIErVonz1I",
      authDomain: "school-attendance-5c91c.firebaseapp.com",
      projectId: "school-attendance-5c91c",
      storageBucket: "school-attendance-5c91c.firebasestorage.app",
      messagingSenderId: "3254054266",
      appId: "1:3254054266:web:246cd39b057a916ebafac3",
      measurementId: "G-PRV1QQM6ML"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const allSchoolClasses = [
      "一年一班", "二年一班", "三年一班", 
      "四年一班", "四年二班", "五年一班", 
      "五年二班", "六年一班", "六年二班"
    ];

    const periodNameMap = {
      0: "導師時間",
      1: "第1節",
      2: "第2節",
      3: "第3節",
      4: "第4節",
      5: "午休",
      6: "第5節",
      7: "第6節",
      8: "第7節"
    };

    let fetchedDocs = [];

    // 🛠️ 班級名稱正規化工具（防止數字/國字/空白不合導致卡片對不上）
    function normalizeClassName(name) {
      if (!name) return "";
      let str = name.trim()
        .replace(/1/g, "一").replace(/2/g, "二")
        .replace(/3/g, "三").replace(/4/g, "四")
        .replace(/5/g, "五").replace(/6/g, "六");
      return str;
    }

    window.onload = function() {
      const today = new Date();
      const monthStr = today.toISOString().substring(0, 7);
      document.getElementById('monthFilter').value = monthStr;

      loadTodayData();
      loadData();
    };

    // 1. 載入當日全校卡片與名單 (已加入廣義比對與除錯)
    async function loadTodayData() {
      const todayStr = new Date().toISOString().substring(0, 10);
      document.getElementById('todayDateStr').innerText = `(${todayStr})`;

      try {
        const snapshot = await db.collection('attendance').where('date', '==', todayStr).get();
        
        const todayMap = {};
        let totalTodayAbsent = 0;
        let doneCount = 0;

        snapshot.forEach(doc => {
          const data = doc.data();
          console.log("今日撈出的資料：", doc.id, data);
          
          const normalizedClass = normalizeClassName(data.className);
          todayMap[normalizedClass] = data;
          doneCount++;
          totalTodayAbsent += (data.absentCount || 0);
        });

        document.getElementById('statDoneClasses').innerText = doneCount;
        document.getElementById('statUndoneClasses').innerText = allSchoolClasses.length - doneCount;
        document.getElementById('statTodayAbsent').innerText = totalTodayAbsent;

        const cardsContainer = document.getElementById('todayClassCards');
        cardsContainer.innerHTML = '';

        allSchoolClasses.forEach(cls => {
          const normalizedKey = normalizeClassName(cls);
          const cardData = todayMap[normalizedKey];
          const card = document.createElement('div');

          if (!cardData) {
            // 未點名班級
            card.className = 'border border-gray-200 bg-gray-50 rounded-xl p-4 opacity-75';
            card.innerHTML = `
              <div class="flex justify-between items-center border-b border-gray-200 pb-2 mb-2">
                <span class="font-bold text-gray-700">${cls}</span>
                <span class="text-xs bg-gray-200 text-gray-600 px-2 py-0.5 rounded font-semibold">⏳ 未點名</span>
              </div>
              <p class="text-xs text-gray-400">導師尚未傳送今日點名資料</p>
            `;
          } else if (cardData.absentCount === 0) {
            // 已點名：全勤
            card.className = 'border border-green-200 bg-green-50/50 rounded-xl p-4';
            card.innerHTML = `
              <div class="flex justify-between items-center border-b border-green-100 pb-2 mb-2">
                <span class="font-bold text-green-900">${cls}</span>
                <span class="text-xs bg-green-200 text-green-800 px-2 py-0.5 rounded font-bold">✓ 全勤</span>
              </div>
              <p class="text-xs text-green-700">實到：${cardData.presentCount} / ${cardData.totalCount} 人</p>
            `;
          } else {
            // 已點名：有人請假
            let listHtml = cardData.absentDetails.map(d => {
              let pStr = '';
              if (d.periods && d.periods.length === 9) {
                pStr = '全天';
              } else if (d.periods) {
                pStr = d.periods.map(p => periodNameMap[p]).join(',');
              }
              return `<div class="text-xs bg-white border border-red-200 text-red-700 px-2 py-1.5 rounded mb-1.5 flex justify-between items-center shadow-sm">
                <span class="font-bold">${d.seatNo}號</span>
                <span class="bg-red-100 px-1.5 py-0.5 rounded text-[11px]">${d.type}</span>
                <span class="text-gray-500 text-[11px]">${pStr}</span>
              </div>`;
            }).join('');

            card.className = 'border border-red-200 bg-red-50/40 rounded-xl p-4 shadow-sm';
            card.innerHTML = `
              <div class="flex justify-between items-center border-b border-red-200 pb-2 mb-2">
                <span class="font-bold text-red-900">${cls}</span>
                <span class="text-xs bg-red-600 text-white px-2 py-0.5 rounded font-bold">缺席 ${cardData.absentCount} 人</span>
              </div>
              <div class="mt-2">
                ${listHtml}
              </div>
            `;
          }

          cardsContainer.appendChild(card);
        });

      } catch (err) {
        console.error("載入當日概況失敗：", err);
      }
    }

    // 2. 載入歷史月份明細 (未動，維持完整性)
    async function loadData() {
      const monthSelected = document.getElementById('monthFilter').value;
      const classSelected = document.getElementById('classFilter').value;
      const tbody = document.getElementById('attendanceTbody');

      if (!monthSelected) {
        alert('請先選擇查詢月份！');
        return;
      }

      tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-gray-500">資料讀取中...</td></tr>';

      try {
        let query = db.collection('attendance').where('month', '==', monthSelected);
        if (classSelected !== 'ALL') {
          query = query.where('className', '==', classSelected);
        }

        const snapshot = await query.get();
        fetchedDocs = [];

        if (snapshot.empty) {
          tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-gray-400">查無此月份的點名紀錄</td></tr>';
          return;
        }

        snapshot.forEach(doc => {
          fetchedDocs.push({ id: doc.id, ...doc.data() });
        });

        fetchedDocs.sort((a, b) => b.date.localeCompare(a.date) || a.className.localeCompare(b.className));

        renderTable();
      } catch (err) {
        console.error("讀取資料失敗：", err);
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-500">載入失敗：${err.message}</td></tr>`;
      }
    }

    function renderTable() {
      const tbody = document.getElementById('attendanceTbody');
      tbody.innerHTML = '';

      fetchedDocs.forEach(doc => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-gray-50 border-b';

        let detailBadges = '';
        if (doc.absentDetails && doc.absentDetails.length > 0) {
          detailBadges = doc.absentDetails.map(d => {
            let pStr = '';
            if (d.periods && d.periods.length === 9) {
              pStr = '全天';
            } else if (d.periods) {
              pStr = d.periods.map(p => periodNameMap[p]).join(',');
            }
            return `<span class="inline-block bg-red-100 text-red-700 text-xs px-2 py-1 rounded-md font-semibold mr-1 mb-1">
              ${d.seatNo}號 [${d.type} - ${pStr}]
            </span>`;
          }).join('');
        } else {
          detailBadges = '<span class="text-green-600 font-semibold text-xs">全勤（無缺席）</span>';
        }

        tr.innerHTML = `
          <td class="p-3 font-semibold text-gray-700">${doc.date}</td>
          <td class="p-3 font-semibold text-gray-800">${doc.className}</td>
          <td class="p-3 text-center font-bold text-gray-600">${doc.totalCount}</td>
          <td class="p-3 text-center font-bold text-green-600">${doc.presentCount}</td>
          <td class="p-3 text-center font-bold ${doc.absentCount > 0 ? 'text-red-600' : 'text-gray-400'}">${doc.absentCount}</td>
          <td class="p-3">${detailBadges}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 匯出 Excel (未動，維持完整性)
    function exportToExcel() {
      if (fetchedDocs.length === 0) {
        alert('目前沒有資料可供匯出！');
        return;
      }

      const monthStr = document.getElementById('monthFilter').value;
      const exportData = [];

      const header = [
        "日期", "班級", "座號", "假別", 
        "導師時間", "第1節", "第2節", "第3節", "第4節", "午休", "第5節", "第6節", "第7節"
      ];
      exportData.push(header);

      fetchedDocs.forEach(doc => {
        if (doc.absentDetails && doc.absentDetails.length > 0) {
          doc.absentDetails.forEach(s => {
            const periodCols = Array(9).fill("");
            
            if (s.periods) {
              s.periods.forEach(pIdx => {
                if (pIdx >= 0 && pIdx <= 8) {
                  periodCols[pIdx] = "V";
                }
              });
            }

            const row = [
              doc.date,
              doc.className,
              `${s.seatNo}號`,
              s.type,
              ...periodCols
            ];
            exportData.push(row);
          });
        }
      });

      if (exportData.length === 1) {
        alert('該月份無任何缺席紀錄，無需匯出缺席細節。');
        return;
      }

      const worksheet = XLSX.utils.aoa_to_sheet(exportData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "缺席名單明細");

      XLSX.writeFile(workbook, `民生國小出缺勤明細_${monthStr}.xlsx`);
    }
  </script>
</body>
</html>
