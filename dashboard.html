<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生導組/行政管理面板 - 晨間點名系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <!-- 引入 SheetJS 用於匯出 Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl p-6">
    
    <!-- 頁頭 -->
    <div class="flex flex-col md:flex-row justify-between items-center border-b pb-4 mb-6">
      <div class="flex items-center space-x-3 mb-4 md:mb-0">
        <img src="https://www.msps.ptc.edu.tw/uploads/1711081122959z3rux6p2.png" alt="民生國小校徽" class="w-12 h-12 object-contain">
        <div>
          <h1 class="text-2xl font-bold text-slate-800">生導組 - 點名管理與匯出面板</h1>
          <p class="text-sm text-slate-500">全校點名紀錄查詢、數據統計與 Excel 報表匯出</p>
        </div>
      </div>
      <button onclick="fetchData()" class="px-4 py-2 bg-slate-800 text-white font-semibold rounded-xl hover:bg-slate-700 transition flex items-center space-x-2">
        <span>🔄 重新整理資料</span>
      </button>
    </div>

    <!-- 篩選與工具列 -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">📅 選擇月份</label>
        <input type="month" id="monthFilter" onchange="fetchData()" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">🏫 篩選班級</label>
        <select id="classFilter" onchange="filterAndRender()" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500">
          <option value="ALL">全校所有班級</option>
          <option value="一年一班">一年一班</option>
          <option value="二年一班">二年一班</option>
          <option value="三年一班">三年一班</option>
          <option value="四年一班">四年一班</option>
          <option value="四年二班">四年二班</option>
          <option value="五年一班">五年一班</option>
          <option value="五年二班">五年二班</option>
          <option value="六年一班">六年一班</option>
          <option value="六年二班">六年二班</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">🔍 狀態篩選</label>
        <select id="statusFilter" onchange="filterAndRender()" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500">
          <option value="ALL">顯示全部紀錄</option>
          <option value="HAS_ABSENT">僅顯示有缺席班級</option>
          <option value="PERFECT">僅顯示全員到齊班級</option>
        </select>
      </div>

      <div class="flex items-end">
        <button onclick="exportToExcel()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow transition flex items-center justify-center space-x-2">
          <span>📊 匯出此月 Excel 總表</span>
        </button>
      </div>
    </div>

    <!-- 數據概覽卡片 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl">
        <p class="text-xs text-blue-600 font-bold">已提交點名紀錄</p>
        <p id="statTotalDocs" class="text-2xl font-black text-blue-900 mt-1">0 筆</p>
      </div>
      <div class="bg-red-50 border border-red-200 p-4 rounded-xl">
        <p class="text-xs text-red-600 font-bold">總缺席人次</p>
        <p id="statTotalAbsent" class="text-2xl font-black text-red-900 mt-1">0 人次</p>
      </div>
      <div class="bg-green-50 border border-green-200 p-4 rounded-xl">
        <p class="text-xs text-green-600 font-bold">全勤天數比例</p>
        <p id="statPerfectRate" class="text-2xl font-black text-green-900 mt-1">0%</p>
      </div>
      <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl">
        <p class="text-xs text-amber-600 font-bold">當月請假最多假別</p>
        <p id="statTopType" class="text-2xl font-black text-amber-900 mt-1">無</p>
      </div>
    </div>

    <!-- 點名紀錄列表表格 -->
    <div class="overflow-x-auto border border-slate-200 rounded-xl">
      <table class="w-full text-left border-collapse text-sm">
        <thead>
          <tr class="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
            <th class="p-3">日期</th>
            <th class="p-3">班級</th>
            <th class="p-3">應到 / 實到</th>
            <th class="p-3">缺席人數</th>
            <th class="p-3">缺席明細 (座號[假別-節次])</th>
            <th class="p-3 text-center">操作</th>
          </tr>
        </thead>
        <tbody id="attendanceTbody" class="divide-y divide-slate-200">
          <tr>
            <td colspan="6" class="text-center p-8 text-slate-400">載入中...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBqdSFkDkjka6hewD9hEfY39KIErVonz1I",
      authDomain: "school-attendance-5c91c.firebaseapp.com",
      projectId: "school-attendance-5c91c",
      storageBucket: "school-attendance-5c91c.firebasestorage.app",
      messagingSenderId: "3254054266",
      appId: "1:3254054266:web:246cd39b057a916ebafac3",
      measurementId: "G-PRV1QQM6ML"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let rawData = [];

    window.onload = function() {
      // 預設選擇當月 (例如 2026-09)
      const now = new Date();
      const currentMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      document.getElementById('monthFilter').value = currentMonth;
      
      fetchData();
    };

    // 抓取指定月份的所有點名紀錄
    async function fetchData() {
      const month = document.getElementById('monthFilter').value;
      const tbody = document.getElementById('attendanceTbody');
      tbody.innerHTML = `<tr><td colspan="6" class="text-center p-8 text-slate-400">正在查詢 ${month} 的點名資料...</td></tr>`;

      try {
        const snapshot = await db.collection('attendance')
          .where('month', '==', month)
          .orderBy('date', 'desc')
          .get();

        rawData = [];
        snapshot.forEach(doc => {
          rawData.push({ id: doc.id, ...doc.data() });
        });

        filterAndRender();
      } catch (err) {
        console.error("抓取失敗：", err);
        tbody.innerHTML = `<tr><td colspan="6" class="text-center p-8 text-red-500">資料讀取失敗，請確認網路連線或 Index 設定。</td></tr>`;
      }
    }

    // 根據前端條件篩選並繪製表格
    function filterAndRender() {
      const classVal = document.getElementById('classFilter').value;
      const statusVal = document.getElementById('statusFilter').value;

      let filtered = rawData.filter(item => {
        const matchClass = (classVal === 'ALL') || (item.className === classVal);
        let matchStatus = true;
        if (statusVal === 'HAS_ABSENT') matchStatus = item.absentCount > 0;
        if (statusVal === 'PERFECT') matchStatus = item.absentCount === 0;
        return matchClass && matchStatus;
      });

      renderTable(filtered);
      updateStats(filtered);
    }

    function renderTable(data) {
      const tbody = document.getElementById('attendanceTbody');
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center p-8 text-slate-400">尚無符合條件的點名紀錄</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(item => {
        const isPerfect = item.absentCount === 0;
        const absentText = isPerfect 
          ? `<span class="px-2 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full">全員到齊</span>`
          : `<span class="px-2 py-1 bg-red-100 text-red-700 text-xs font-bold rounded-full">${item.absentCount} 人缺席</span>`;

        const detailsText = item.absentList && item.absentList.length > 0 
          ? item.absentList.join('、 ') 
          : '<span class="text-slate-400">-</span>';

        return `
          <tr class="hover:bg-slate-50 border-b border-slate-100">
            <td class="p-3 font-semibold text-slate-800">${item.date}</td>
            <td class="p-3 font-bold text-blue-900">${item.className}</td>
            <td class="p-3 text-slate-600">${item.totalCount}人 / ${item.presentCount}人</td>
            <td class="p-3">${absentText}</td>
            <td class="p-3 text-slate-700 font-mono text-xs">${detailsText}</td>
            <td class="p-3 text-center">
              <button onclick="deleteDoc('${item.id}')" class="text-xs text-red-500 hover:text-red-700 font-bold px-2 py-1 rounded border border-red-200 hover:bg-red-50">刪除</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    // 更新頂部數據指標
    function updateStats(data) {
      document.getElementById('statTotalDocs').textContent = `${data.length} 筆`;
      
      const totalAbsent = data.reduce((sum, item) => sum + (item.absentCount || 0), 0);
      document.getElementById('statTotalAbsent').textContent = `${totalAbsent} 人次`;

      const perfectCount = data.filter(item => item.absentCount === 0).length;
      const rate = data.length > 0 ? Math.round((perfectCount / data.length) * 100) : 0;
      document.getElementById('statPerfectRate').textContent = `${rate}%`;

      // 統計最多請假假別
      const typeCounts = {};
      data.forEach(item => {
        if (item.absentDetails) {
          item.absentDetails.forEach(d => {
            typeCounts[d.type] = (typeCounts[d.type] || 0) + 1;
          });
        }
      });

      let topType = '無';
      let maxC = 0;
      for (const [t, c] of Object.entries(typeCounts)) {
        if (c > maxC) { maxC = c; topType = `${t} (${c}次)`; }
      }
      document.getElementById('statTopType').textContent = topType;
    }

    // 刪除紀錄
    async function deleteDoc(docId) {
      if (confirm(`確定要刪除這筆紀錄 (${docId}) 嗎？此操作無法復原！`)) {
        try {
          await db.collection('attendance').doc(docId).delete();
          alert('刪除成功！');
          fetchData();
        } catch (err) {
          alert('刪除失敗：' + err.message);
        }
      }
    }

    // 匯出至 Excel (.xlsx)
    function exportToExcel() {
      const month = document.getElementById('monthFilter').value;
      if (rawData.length === 0) {
        alert('目前無資料可供匯出！');
        return;
      }

      // 格式化匯出資料
      const exportRows = [];
      rawData.forEach(item => {
        if (item.absentDetails && item.absentDetails.length > 0) {
          item.absentDetails.forEach(d => {
            const periodStr = d.periods.length === 7 ? '全天' : `第${d.periods.join(',')}節`;
            exportRows.push({
              "日期": item.date,
              "班級": item.className,
              "座號": d.seatNo,
              "假別": d.type,
              "請假節數": d.periods.length,
              "請假節次明細": periodStr,
              "提交時間": item.timestamp ? new Date(item.timestamp.seconds * 1000).toLocaleString('zh-TW') : ''
            });
          });
        } else {
          // 全員到齊紀錄
          exportRows.push({
            "日期": item.date,
            "班級": item.className,
            "座號": "全班",
            "假別": "全員到齊",
            "請假節數": 0,
            "請假節次明細": "-",
            "提交時間": item.timestamp ? new Date(item.timestamp.seconds * 1000).toLocaleString('zh-TW') : ''
          });
        }
      });

      const worksheet = XLSX.utils.json_to_sheet(exportRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "缺席報表");

      // 匯出檔案
      XLSX.writeFile(workbook, `民生國小_點名紀錄報表_${month}.xlsx`);
    }
  </script>
</body>
</html>
