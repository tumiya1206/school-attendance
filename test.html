<!DOCTYPE html>
<html lang="zh-TW">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body class="bg-slate-100 min-h-screen p-4 md:p-6">

  <!-- 三欄式響應式網頁佈局 (大螢幕：3 : 6 : 3) -->
  <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">

    <!-- ================= 左側：當週學校行事曆 (大螢幕佔 3 欄) ================= -->
    <div class="lg:col-span-3 bg-white rounded-2xl shadow-md p-5 space-y-4">
      <div class="border-b pb-3">
        <div class="flex items-center justify-between mb-1">
          <h3 class="text-base font-bold text-slate-800 flex items-center gap-1.5">
            📅 當週行事曆
          </h3>
          <span id="currentWeekBadge" class="text-xs font-bold px-2 py-0.5 bg-blue-100 text-blue-700 rounded-md">
            第 - 週
          </span>
        </div>
        <p id="weekRangeText" class="text-xs text-slate-500">日期：--/-- ~ --/--</p>
      </div>

      <!-- 當週行程列表 container -->
      <div id="weeklyCalendar" class="space-y-3 text-xs max-h-[75vh] overflow-y-auto pr-1">
        <!-- JS 動態帶入當週行政、教導、總務事項 -->
      </div>
    </div>

    <!-- ================= 中間：屏東市民生國小班級電子晨檢簿 (大螢幕佔 6 欄) ================= -->
    <div class="lg:col-span-6 bg-white rounded-2xl shadow-md p-6 relative">
      
      <!-- 頂部標題區 -->
      <div class="flex flex-col items-center justify-center mb-6 text-center">
        <img src="https://www.msps.ptc.edu.tw/uploads/1711081122959z3rux6p2.png" alt="民生國小校徽" class="w-200 h-200 object-contain mb-2">
        <h2 class="text-xl md:text-2xl font-bold text-gray-800">屏東市民生國小班級電子晨檢簿</h2>
      </div>
      
      <div class="space-y-4 mb-6">
        <!-- 📅 點名/補登日期選擇 -->
        <div class="bg-blue-50 p-3 rounded-xl border border-blue-200">
          <label class="block text-sm font-bold text-blue-900 mb-1">📅 點名 / 補登日期</label>
          <input type="date" id="attendanceDate" onchange="checkAndGenerate()" class="w-full p-2.5 border border-blue-300 rounded-lg text-sm bg-white font-semibold outline-none focus:ring-2 focus:ring-blue-500">
          <p id="deadlineTip" class="text-xs font-semibold mt-1.5 text-blue-700"></p>
        </div>

        <!-- 🏫 選擇班級 與 👥 選擇人數 (雙欄排列節省空間) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">1. 選擇班級</label>
            <select id="classSelect" onchange="checkAndGenerate()" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
              <option value="">-- 請選擇班級 --</option>
              <option value="一年一班">一年一班</option>
              <option value="二年一班">二年一班</option>
              <option value="三年一班">三年一班</option>
              <option value="四年一班">四年一班</option>
              <option value="四年二班">四年二班</option>
              <option value="五年一班">五年一班</option>
              <option value="五年二班">五年二班</option>
              <option value="六年一班">六年一班</option>
              <option value="六年二班">六年二班</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">2. 選擇該班人數 (15~28人)</label>
            <select id="countSelect" onchange="checkAndGenerate()" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm"></select>
          </div>
        </div>
      </div>

      <!-- 逾期警告標語 -->
      <div id="lockWarning" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl mb-4 text-sm font-bold text-center">
        ⚠️ 該月份已超過補登期限（次月 2 日截止），無法修改或提交！
      </div>

      <div id="info" class="text-center text-sm text-gray-500 mb-4">請選擇日期與班級</div>
      
      <!-- 座號點名按鈕區 -->
      <div id="studentGrid" class="grid grid-cols-4 sm:grid-cols-5 gap-2 mb-6"></div>

      <!-- 按鈕區 -->
      <button id="submitBtn" onclick="submit()" style="display:none;" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition disabled:bg-gray-400 disabled:cursor-not-allowed">
        提交點名紀錄

        </div>

        <div class="font-bold text-slate-700 flex items-center gap-1">

    </div>

        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
      </div>

        <label class="block text-sm font-semibold text-gray-700 mb-1">假別</label>
        <select id="leaveTypeSelect" class="w-full p-2.5 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">

          <option value="病假">病假</option>
          <option value="公假">公假</option>
          <option value="喪假">喪假</option>
          <option value="曠課">曠課</option>
        </select>
      </div>

          <button type="button" onclick="toggleAllPeriods()" class="text-xs text-blue-600 font-bold">全選 / 全不選</button>
        </div>

        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="clearStudentAbsent()" class="w-1/3 py-2.5 bg-gray-200 text-gray-700 font-bold rounded-xl">改為出席</button>
        <button onclick="saveStudentAbsent()" class="w-2/3 py-2.5 bg-blue-600 text-white font-bold rounded-xl shadow">儲存設定</button>
      </div>
    </div>

      { week: "二十", startDate: "2027-01-11", endDate: "2027-01-17", dateRange: "01/11 ~ 01/17", 
       admin: ["第二次定期評量 1/12(二)-13(三)", "期末校務會議"],
       academic: ["學習榮譽卡頒獎", "學籍3.0系統完成成績 (1/15前)"], 
       general: ["校園環境安全檢修", "飲用水檢查清理"] },
      { week: "二十一", startDate: "2027-01-18", endDate: "2027-01-20", dateRange: "01/18 ~ 01/20", 
       admin: ["休業式 1/20(三)", "寒假開始 1/21(四)"], 
       academic: ["圖書室閉館整理", "各項期末檢討會議"], 
       general: ["辦理二手教科書/制服回收", "午餐與環境教育檢討會"] }
    ];

    /* ================= 4. 工作日倒數計算 logic ================= */
    function updateWinterVacationCountdown() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const targetDate = new Date(2027, 0, 21); // 2027年1月21日 (寒假第一天)
      targetDate.setHours(0, 0, 0, 0);

      if (today >= targetDate) {
        document.getElementById('countdownDays').textContent = '0';
        document.getElementById('calendarDaysText').textContent = '🥳 已經放寒假囉！';
        return;
      }

      let workdays = 0;
      let calendarDays = 0;
      let cur = new Date(today.getTime());

      while (cur < targetDate) {
        const dayOfWeek = cur.getDay(); // 0: 日, 6: 六
        const year = cur.getFullYear();
        const month = String(cur.getMonth() + 1).padStart(2, '0');
        const date = String(cur.getDate()).padStart(2, '0');
        const dateStr = `${year}-${month}-${date}`;

        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
        const isHoliday = holidays.includes(dateStr);

        if (!isWeekend && !isHoliday) {
          workdays++;
        }
        
        calendarDays++;
        cur.setDate(cur.getDate() + 1);
      }

      document.getElementById('countdownDays').textContent = workdays;
      document.getElementById('calendarDaysText').textContent = `（含例假日共 ${calendarDays} 天）`;
    }

    /* ================= 5. 頁面初始化與行事曆渲染 ================= */
    window.onload = function() {
      const todayStr = new Date().toISOString().split('T')[0];
      document.getElementById('attendanceDate').value = todayStr;

      const countSelect = document.getElementById('countSelect');
      for (let i = 15; i <= 28; i++) {
        let opt = document.createElement('option');
        opt.value = i; opt.textContent = i + ' 人';
        if (i === 28) opt.selected = true;
        countSelect.appendChild(opt);
      }

      renderCalendar(todayStr);
      updateWinterVacationCountdown();
    };

    function renderCalendar(targetDateStr) {
      let currentEvent = schoolEvents.find(e => targetDateStr >= e.startDate && targetDateStr <= e.endDate);
      if (!currentEvent) {
        currentEvent = schoolEvents[1]; 
      }

      document.getElementById('currentWeekBadge').textContent = `第 ${currentEvent.week} 週`;
      document.getElementById('weekRangeText').textContent = `日期：${currentEvent.dateRange}`;

      const container = document.getElementById('weeklyCalendar');
      let html = '';

      if (currentEvent.admin.length > 0) {
        html += renderSection('🏛️ 行政/校務', currentEvent.admin, 'bg-slate-50 border-slate-200 text-slate-700');
      }
      if (currentEvent.academic.length > 0) {
        html += renderSection('📚 教導處', currentEvent.academic, 'bg-blue-50 border-blue-200 text-blue-800');
      }
      if (currentEvent.general.length > 0) {
        html += renderSection('🔧 總務處', currentEvent.general, 'bg-amber-50 border-amber-200 text-amber-800');
      }

      container.innerHTML = html;
    }

    function renderSection(title, list, styleClasses) {
      const items = list.map(item => `<li class="list-disc list-inside">${item}</li>`).join('');
      return `
        <div class="p-2.5 rounded-lg border ${styleClasses} space-y-1">
          <div class="font-bold border-b border-black/10 pb-1 mb-1">${title}</div>
          <ul class="space-y-1 leading-snug">
            ${items}
          </ul>
        </div>
      `;
    }

    /* ================= 6. 點名系統的核心邏輯 ================= */
    function checkDeadline(selectedDateStr) {
      if (!selectedDateStr) return false;
      const [year, month, day] = selectedDateStr.split('-').map(Number);
      const deadlineDate = new Date(year, month, 2, 23, 59, 59);
      const now = new Date();

      const targetMonthStr = `${month}月`;
      const deadlineMonthStr = `${deadlineDate.getMonth() + 1}月2日`;
      document.getElementById('deadlineTip').textContent = `📌 ${targetMonthStr}紀錄補登截止時間：${deadlineDate.getFullYear()}/${deadlineMonthStr} 23:59`;

      return now > deadlineDate;
    }

    async function checkAndGenerate() {
      const selectedDate = document.getElementById('attendanceDate').value;
      const className = document.getElementById('classSelect').value;
      const totalCount = parseInt(document.getElementById('countSelect').value, 10);

      const submitBtn = document.getElementById('submitBtn');
      const lockWarning = document.getElementById('lockWarning');

      if (selectedDate) {
        renderCalendar(selectedDate);
      }

      if (!selectedDate || !className || !totalCount) {
        document.getElementById('studentGrid').innerHTML = '';
        submitBtn.style.display = 'none';
        lockWarning.classList.add('hidden');
        document.getElementById('info').textContent = '請先選擇日期、班級與人數';
        return;
      }

      isExpired = checkDeadline(selectedDate);

      if (isExpired) {
        lockWarning.classList.remove('hidden');
        submitBtn.disabled = true;
      } else {
        lockWarning.classList.add('hidden');
        submitBtn.disabled = false;
      }

      seatsData = Array.from({ length: totalCount }, (_, i) => ({
        seatNo: i + 1,
        absent: false,
        type: '事假',
        periods: [0, 1, 2, 3, 4, 5, 6, 7, 8]
      }));

      const docId = `${selectedDate}_${className}`;
      try {
        const doc = await db.collection('attendance').doc(docId).get();
        if (doc.exists) {
          const data = doc.data();
          if (data.absentDetails) {
            data.absentDetails.forEach(detail => {
              const idx = seatsData.findIndex(s => s.seatNo === detail.seatNo);
              if (idx !== -1) {
                seatsData[idx] = { ...detail };
              }
            });
          }
        }
      } catch (err) {
        console.error("讀取歷史紀錄失敗:", err);
      }

      renderGrid();
      document.getElementById('info').textContent = `${selectedDate} ${className}（共 ${totalCount} 人）${isExpired ? ' [已鎖定唯讀]' : ''}`;
      
      submitBtn.style.display = 'block';
    }

    function renderGrid() {
      const grid = document.getElementById('studentGrid');
      grid.innerHTML = '';
      seatsData.forEach((s, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `p-2 rounded-xl font-bold text-center border-2 transition ${s.absent ? 'bg-red-50 text-red-700 border-red-500' : 'bg-green-50 text-green-800 border-green-500'}`;
        
        let subText = s.absent ? `${s.type}(${s.periods ? s.periods.length : 0}節)` : '出席';
        btn.innerHTML = `<div class="text-base">${s.seatNo}號</div><div class="text-xs font-semibold ${s.absent ? 'text-red-600' : 'text-green-600'}">${subText}</div>`;
        
        btn.onclick = () => {
          if (isExpired) {
            alert('⚠️ 該月份補登期限已過，無法修改缺席紀錄！');
            return;
          }
          openModal(idx);
        };
        grid.appendChild(btn);
      });
    }

    /* ================= 7. Modal 彈窗操控 ================= */
    function openModal(idx) {
      currentEditIdx = idx;
      const s = seatsData[idx];
      document.getElementById('modalTitle').textContent = `設定 ${s.seatNo} 號缺席明細`;
      document.getElementById('leaveTypeSelect').value = s.type || '事假';
      
      const cbs = document.querySelectorAll('.period-cb');
      cbs.forEach(cb => {
        cb.checked = s.absent ? (s.periods && s.periods.includes(parseInt(cb.value, 10))) : true;
      });
      
      const modal = document.getElementById('modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function toggleAllPeriods() {
      const cbs = document.querySelectorAll('.period-cb');
      const allChecked = Array.from(cbs).every(cb => cb.checked);
      cbs.forEach(cb => cb.checked = !allChecked);
    }

    function saveStudentAbsent() {
      if (currentEditIdx === null) return;
      const selectedPeriods = Array.from(document.querySelectorAll('.period-cb:checked')).map(cb => parseInt(cb.value, 10));
      if (selectedPeriods.length === 0) {
        alert('請至少選擇一個時段，或點擊「改為出席」！');
        return;
      }
      seatsData[currentEditIdx].absent = true;
      seatsData[currentEditIdx].type = document.getElementById('leaveTypeSelect').value;
      seatsData[currentEditIdx].periods = selectedPeriods.sort((a,b) => a - b);
      closeModal();
      renderGrid();
    }

    function clearStudentAbsent() {
      if (currentEditIdx === null) return;
      seatsData[currentEditIdx].absent = false;
      closeModal();
      renderGrid();
    }

    /* ================= 8. 資料提交至 Firebase ================= */
    async function submit() {
      if (isExpired) {
        alert('⚠️ 該月份點名已超過補登截止時間，無法提交！');
        return;
      }

      const selectedDate = document.getElementById('attendanceDate').value;
      const className = document.getElementById('classSelect').value;
      
      const absentList = seatsData.filter(s => s.absent).map(s => {
        let periodStr = '';
        if (s.periods.length === 9) {
          periodStr = '全天';
        } else {
          periodStr = s.periods.map(p => periodNameMap[p]).join(',');
        }
        return `${s.seatNo}號[${s.type}-${periodStr}]`;
      });
      
      const monthStr = selectedDate.substring(0, 7);
      const docId = `${selectedDate}_${className}`;

      if (confirm(`確認提交 ${selectedDate} ${className} 點名紀錄？\n缺席名單：\n${absentList.length > 0 ? absentList.join('\n') : '無（全員到齊）'}`)) {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.innerText = '傳送中...';
        try {
          await db.collection('attendance').doc(docId).set({
            date: selectedDate,
            month: monthStr,
            className: className,
            totalCount: seatsData.length,
            presentCount: seatsData.length - absentList.length,
            absentCount: absentList.length,
            absentList: absentList,
            absentDetails: seatsData.filter(s => s.absent),
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
          alert('提交成功！已存入點名紀錄。');
          location.reload();
        } catch (error) {
          alert('提交失敗：' + error.message);
          btn.disabled = false; btn.innerText = '提交點名紀錄';
        }
      }
    }
  </script>
