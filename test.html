<body class="bg-slate-100 min-h-screen p-4 md:p-6">

  <!-- Responsive Grid: 手機單欄，電腦版 (3 : 6 : 3) -->

    <!-- ================= 左側：當週學校行事曆 (大螢幕佔 3 欄) ================= -->

      <div class="border-b pb-3">
        <div class="flex items-center justify-between mb-1">
          <h3 class="text-base font-bold text-slate-800 flex items-center gap-1.5">
            📅 當週行事曆
          </h3>
          <span id="currentWeekBadge" class="text-xs font-bold px-2 py-0.5 bg-blue-100 text-blue-700 rounded-md">
            第 - 週
          </span>
        </div>
        <p id="weekRangeText" class="text-xs text-slate-500">日期：--/-- ~ --/--</p>
      </div>

      <!-- 當週行程列表 container -->
      <div id="weeklyCalendar" class="space-y-3 text-xs max-h-[70vh] overflow-y-auto pr-1">
        <!-- JS 動態帶入當週行政、教導、總務事項 -->
      </div>
    </div>

    <!-- ================= 中間：補點名 / 補登記表單 (大螢幕佔 6 欄，視覺重點) ================= -->
    <div class="lg:col-span-6 bg-white rounded-xl shadow-md p-6 space-y-5">
      <div class="flex items-center space-x-3 border-b pb-3">
        <img src="https://www.msps.ptc.edu.tw/uploads/1711081122959z3rux6p2.png" alt="校徽" class="w-10 h-10 object-contain bg-white rounded-full p-0.5 border border-slate-200">
        <div>
          <h2 class="text-xl font-bold text-slate-800">出勤補點名 / 補登記申請</h2>
          <p class="text-xs text-slate-500">請填寫缺勤或補點名資料，送出後將由系統進行記錄</p>
        </div>
      </div>

      <form id="retroactiveForm" class="space-y-4">
        <div>
          <label for="recordDate" class="block text-sm font-medium text-slate-700 mb-1">
            補登記日期 <span class="text-xs text-rose-500">（截止日：次月 2 號 23:59 止）</span>
          </label>
          <input 
            type="date" 
            id="recordDate" 
            name="recordDate"
            required
            class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none border-slate-300 text-sm"
          >
        </div>

        <!-- 錯誤提示訊息區域 -->
        <div id="errorAlert" class="hidden p-3 bg-rose-50 border border-rose-200 text-rose-600 rounded-lg text-sm"></div>

        <div>
          <label for="reason" class="block text-sm font-medium text-slate-700 mb-1">補登記事由 / 備註</label>
          <textarea 
            id="reason" 
            name="reason" 
            rows="4" 
            required
            class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none border-slate-300 text-sm"
            placeholder="請輸入補點名原因或說明..."
          ></textarea>
        </div>

        <button 
          type="submit" 
          id="submitBtn"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors shadow-sm disabled:bg-slate-300 disabled:cursor-not-allowed"
        >
          送出申請
        </button>
      </form>
    </div>

      <svg class="w-10 h-10 mb-2 stroke-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <p class="text-sm font-medium">預留擴充區塊</p>
      <p class="text-xs text-slate-400 mt-1">（日後可放入常用連結、公告或最新審核紀錄）</p>

    // 動態載入當週行事曆
    function renderCurrentWeekEvents() {
      const todayStr = new Date().toISOString().split('T')[0];
      
      // 尋找今天屬於哪一週，若不在範圍內預設顯示當下週次
      let currentEvent = schoolEvents.find(e => todayStr >= e.startDate && todayStr <= e.endDate);
      if (!currentEvent) {
        currentEvent = schoolEvents[1]; // 預設顯示第二週（09/07 ~ 09/13）
      }

      document.getElementById('currentWeekBadge').textContent = `第 ${currentEvent.week} 週`;
      document.getElementById('weekRangeText').textContent = `日期：${currentEvent.dateRange}`;

      const container = document.getElementById('weeklyCalendar');
      let html = '';

      // 產生行政事項區塊
      if (currentEvent.admin.length > 0) {
        html += renderSection('🏛️ 行政/校務', currentEvent.admin, 'bg-slate-50 border-slate-200 text-slate-700');
      }

      // 產生教導處事項區塊
      if (currentEvent.academic.length > 0) {
        html += renderSection('📚 教導處', currentEvent.academic, 'bg-blue-50 border-blue-200 text-blue-800');
      }

      // 產生總務處事項區塊
      if (currentEvent.general.length > 0) {
        html += renderSection('🔧 總務處', currentEvent.general, 'bg-amber-50 border-amber-200 text-amber-800');
      }

      container.innerHTML = html;
    }

    function renderSection(title, list, styleClasses) {
      const items = list.map(item => `<li class="list-disc list-inside">${item}</li>`).join('');
      return `
        <div class="p-2.5 rounded-lg border ${styleClasses} space-y-1">
          <div class="font-bold border-b border-black/10 pb-1 mb-1">${title}</div>
          <ul class="space-y-1 leading-snug">
            ${items}
          </ul>
        </div>
      `;
    }

    // 補登記表單截止日檢查邏輯
    const recordDateInput = document.getElementById('recordDate');
    const submitBtn = document.getElementById('submitBtn');
    const errorAlert = document.getElementById('errorAlert');

    recordDateInput.addEventListener('change', function() {
      if (!this.value) return;
      const recDate = new Date(this.value);
      const today = new Date();
      const deadline = new Date(recDate.getFullYear(), recDate.getMonth() + 1, 2, 23, 59, 59);

      if (today > deadline) {
        errorAlert.textContent = '⚠️ 該月份補登記已於次月 2 號截止，目前無法進行補登記！';
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = true;
      } else {
        errorAlert.classList.add('hidden');
        submitBtn.disabled = false;
      }
    });

    window.addEventListener('DOMContentLoaded', renderCurrentWeekEvents);
