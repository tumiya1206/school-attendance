<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級晨間點名與補登系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <!-- 引入 SheetJS 處理 Excel 匯出 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-md p-6 relative">
    
    <!-- 頂部標題區 -->
    <div class="flex flex-col items-center justify-center mb-6">
      <img src="logo.png" alt="校徽" class="w-16 h-16 object-contain mb-2" onerror="this.style.display='none'">
      <h2 class="text-2xl font-bold text-gray-800">班級點名與補登系統</h2>
    </div>
    
    <div class="space-y-4 mb-6">
      <!-- 📅 點名/補登日期選擇 -->
      <div class="bg-blue-50 p-3 rounded-xl border border-blue-200">
        <label class="block text-sm font-bold text-blue-900 mb-1">📅 點名 / 補登日期</label>
        <input type="date" id="attendanceDate" onchange="checkAndGenerate()" class="w-full p-2.5 border border-blue-300 rounded-lg text-sm bg-white font-semibold outline-none focus:ring-2 focus:ring-blue-500">
        <p id="deadlineTip" class="text-xs font-semibold mt-1.5 text-blue-700"></p>
      </div>

      <!-- 🏫 選擇班級 -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">1. 選擇班級</label>
        <select id="classSelect" onchange="checkAndGenerate()" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="">-- 請選擇班級 --</option>
          <option value="一年一班">一年一班</option>
          <option value="二年一班">二年一班</option>
          <option value="三年一班">三年一班</option>
          <option value="四年一班">四年一班</option>
          <option value="四年二班">四年二班</option>
          <option value="五年一班">五年一班</option>
          <option value="五年二班">五年二班</option>
          <option value="六年一班">六年一班</option>
          <option value="六年二班">六年二班</option>
        </select>
      </div>

      <!-- 👥 選擇人數 -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">2. 選擇該班人數 (18~28人)</label>
        <select id="countSelect" onchange="checkAndGenerate()" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none"></select>
      </div>
    </div>

    <!-- 逾期警告標語 -->
    <div id="lockWarning" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl mb-4 text-sm font-bold text-center">
      ⚠️ 該月份已超過補登期限（次月 2 日截止），無法修改或提交！
    </div>

    <div id="info" class="text-center text-sm text-gray-500 mb-4">請選擇日期與班級</div>
    <div id="studentGrid" class="grid grid-cols-4 gap-2 mb-6"></div>

    <!-- 按鈕區 -->
    <div class="space-y-3">
      <button id="submitBtn" onclick="submit()" style="display:none;" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition disabled:bg-gray-400 disabled:cursor-not-allowed">
        提交點名紀錄
      </button>

      <!-- 🟢 導師班級 Excel 匯出按鈕（行政同款格式） -->
      <button id="exportExcelBtn" onclick="exportClassMonthlyExcel()" style="display:none;" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        匯出本班學籍匯入檔 (Excel)
      </button>
    </div>
  </div>

  <!-- 缺席細節設定彈窗 Modal -->
  <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="modalTitle" class="text-lg font-bold text-gray-800">設定缺席明細</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">假別</label>
        <select id="leaveTypeSelect" class="w-full p-2.5 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
          <option value="事假">事假</option>
          <option value="病假">病假</option>
          <option value="公假">公假</option>
          <option value="喪假">喪假</option>
          <option value="曠課">曠課</option>
        </select>
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-sm font-semibold text-gray-700">請假節次</label>
          <button type="button" onclick="toggleAllPeriods()" class="text-xs text-blue-600 font-bold">全選 / 全不選</button>
        </div>
        <div class="grid grid-cols-4 gap-2 text-sm">
          <label class="flex items-center space-x-1 border p-2 rounded-lg cursor-pointer"><input type="checkbox" class="period-cb" value="1"> <span>第1節</span></label>
          <label class="flex items-center space-x-1 border p-2 rounded-lg cursor-pointer"><input type="checkbox" class="period-cb" value="2"> <span>第2節</span></label>
          <label class="flex items-center space-x-1 border p-2 rounded-lg cursor-pointer"><input type="checkbox" class="period-cb" value="3"> <span>第3節</span></label>
          <label class="flex items-center space-x-1 border p-2 rounded-lg cursor-pointer"><input type="checkbox" class="period-cb" value="4"> <span>第4節</span></label>
          <label class="flex items-center space-x-1 border p-2 rounded-lg cursor-pointer"><input type="checkbox" class="period-cb" value="5"> <span>第5節</span></label>
          <label class="flex items-center space-x-1 border p-2 rounded-lg cursor-pointer"><input type="checkbox" class="period-cb" value="6"> <span>第6節</span></label>
          <label class="flex items-center space-x-1 border p-2 rounded-lg cursor-pointer"><input type="checkbox" class="period-cb" value="7"> <span>第7節</span></label>
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="clearStudentAbsent()" class="w-1/3 py-2.5 bg-gray-200 text-gray-700 font-bold rounded-xl">改為出席</button>
        <button onclick="saveStudentAbsent()" class="w-2/3 py-2.5 bg-blue-600 text-white font-bold rounded-xl shadow">儲存設定</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBqdSFkDkjka6hewD9hEfY39KIErVonz1I",
      authDomain: "school-attendance-5c91c.firebaseapp.com",
      projectId: "school-attendance-5c91c",
      storageBucket: "school-attendance-5c91c.firebasestorage.app",
      messagingSenderId: "3254054266",
      appId: "1:3254054266:web:246cd39b057a916ebafac3",
      measurementId: "G-PRV1QQM6ML"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let seatsData = [];
    let currentEditIdx = null;
    let isExpired = false;

    window.onload = function() {
      const todayStr = new Date().toISOString().split('T')[0];
      document.getElementById('attendanceDate').value = todayStr;

      const countSelect = document.getElementById('countSelect');
      for (let i = 18; i <= 28; i++) {
        let opt = document.createElement('option');
        opt.value = i; opt.textContent = i + ' 人';
        if (i === 28) opt.selected = true;
        countSelect.appendChild(opt);
      }
    };

    function checkDeadline(selectedDateStr) {
      if (!selectedDateStr) return false;
      const [year, month, day] = selectedDateStr.split('-').map(Number);
      const deadlineDate = new Date(year, month, 2, 23, 59, 59);
      const now = new Date();

      const targetMonthStr = `${month}月`;
      const deadlineMonthStr = `${deadlineDate.getMonth() + 1}月2日`;
      document.getElementById('deadlineTip').textContent = `📌 ${targetMonthStr}紀錄補登截止時間：${deadlineDate.getFullYear()}/${deadlineMonthStr} 23:59`;

      return now > deadlineDate;
    }

    async function checkAndGenerate() {
      const selectedDate = document.getElementById('attendanceDate').value;
      const className = document.getElementById('classSelect').value;
      const totalCount = parseInt(document.getElementById('countSelect').value, 10);

      const submitBtn = document.getElementById('submitBtn');
      const exportExcelBtn = document.getElementById('exportExcelBtn');
      const lockWarning = document.getElementById('lockWarning');

      if (!selectedDate || !className || !totalCount) {
        document.getElementById('studentGrid').innerHTML = '';
        submitBtn.style.display = 'none';
        exportExcelBtn.style.display = 'none';
        lockWarning.classList.add('hidden');
        document.getElementById('info').textContent = '請先選擇日期、班級與人數';
        return;
      }

      isExpired = checkDeadline(selectedDate);

      if (isExpired) {
        lockWarning.classList.remove('hidden');
        submitBtn.disabled = true;
      } else {
        lockWarning.classList.add('hidden');
        submitBtn.disabled = false;
      }

      seatsData = Array.from({ length: totalCount }, (_, i) => ({
        seatNo: i + 1,
        absent: false,
        type: '事假',
        periods: [1,2,3,4,5,6,7]
      }));

      const docId = `${selectedDate}_${className}`;
      try {
        const doc = await db.collection('attendance').doc(docId).get();
        if (doc.exists) {
          const data = doc.data();
          if (data.absentDetails) {
            data.absentDetails.forEach(detail => {
              const idx = seatsData.findIndex(s => s.seatNo === detail.seatNo);
              if (idx !== -1) {
                seatsData[idx] = { ...detail };
              }
            });
          }
        }
      } catch (err) {
        console.error("讀取歷史紀錄失敗:", err);
      }

      renderGrid();
      document.getElementById('info').textContent = `${selectedDate} ${className}（共 ${totalCount} 人）${isExpired ? ' [已鎖定唯讀]' : ''}`;
      
      submitBtn.style.display = 'block';
      exportExcelBtn.style.display = 'block';
    }

    function renderGrid() {
      const grid = document.getElementById('studentGrid');
      grid.innerHTML = '';
      seatsData.forEach((s, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `p-2 rounded-xl font-bold text-center border-2 transition ${s.absent ? 'bg-red-50 text-red-700 border-red-500' : 'bg-green-50 text-green-800 border-green-500'}`;
        
        let subText = s.absent ? `${s.type}(${s.periods.length}節)` : '出席';
        btn.innerHTML = `<div class="text-base">${s.seatNo}號</div><div class="text-xs font-semibold ${s.absent ? 'text-red-600' : 'text-green-600'}">${subText}</div>`;
        
        btn.onclick = () => {
          if (isExpired) {
            alert('⚠️ 該月份補登期限已過，無法修改缺席紀錄！');
            return;
          }
          openModal(idx);
        };
        grid.appendChild(btn);
      });
    }

    function openModal(idx) {
      currentEditIdx = idx;
      const s = seatsData[idx];
      document.getElementById('modalTitle').textContent = `設定 ${s.seatNo} 號缺席明細`;
      document.getElementById('leaveTypeSelect').value = s.type || '事假';
      
      const cbs = document.querySelectorAll('.period-cb');
      cbs.forEach(cb => {
        cb.checked = s.absent ? s.periods.includes(parseInt(cb.value, 10)) : true;
      });
      
      const modal = document.getElementById('modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function toggleAllPeriods() {
      const cbs = document.querySelectorAll('.period-cb');
      const allChecked = Array.from(cbs).every(cb => cb.checked);
      cbs.forEach(cb => cb.checked = !allChecked);
    }

    function saveStudentAbsent() {
      if (currentEditIdx === null) return;
      const selectedPeriods = Array.from(document.querySelectorAll('.period-cb:checked')).map(cb => parseInt(cb.value, 10));
      if (selectedPeriods.length === 0) {
        alert('請至少選擇一節課，或點擊「改為出席」！');
        return;
      }
      seatsData[currentEditIdx].absent = true;
      seatsData[currentEditIdx].type = document.getElementById('leaveTypeSelect').value;
      seatsData[currentEditIdx].periods = selectedPeriods.sort((a,b) => a - b);
      closeModal();
      renderGrid();
    }

    function clearStudentAbsent() {
      if (currentEditIdx === null) return;
      seatsData[currentEditIdx].absent = false;
      closeModal();
      renderGrid();
    }

    async function submit() {
      if (isExpired) {
        alert('⚠️ 該月份點名已超過補登截止時間，無法提交！');
        return;
      }

      const selectedDate = document.getElementById('attendanceDate').value;
      const className = document.getElementById('classSelect').value;
      
      const absentList = seatsData.filter(s => s.absent).map(s => {
        const periodStr = s.periods.length === 7 ? '全天' : `第${s.periods.join(',')}節`;
        return `${s.seatNo}號[${s.type}-${periodStr}]`;
      });
      
      const monthStr = selectedDate.substring(0, 7);
      const docId = `${selectedDate}_${className}`;

      if (confirm(`確認提交 ${selectedDate} ${className} 點名紀錄？\n缺席名單：\n${absentList.length > 0 ? absentList.join('\n') : '無（全員到齊）'}`)) {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.innerText = '傳送中...';
        try {
          await db.collection('attendance').doc(docId).set({
            date: selectedDate,
            month: monthStr,
            className: className,
            totalCount: seatsData.length,
            presentCount: seatsData.length - absentList.length,
            absentCount: absentList.length,
            absentList: absentList,
            absentDetails: seatsData.filter(s => s.absent),
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
          alert('提交成功！已存入點名紀錄。');
          location.reload();
        } catch (error) {
          alert('提交失敗：' + error.message);
          btn.disabled = false; btn.innerText = '提交點名紀錄';
        }
      }
    }

    // 🟢 導師班級專用 Excel 匯出邏輯（完全採用學籍系統 / 行政同款匯出格式，僅過濾該班）
    async function exportClassMonthlyExcel() {
      const selectedDate = document.getElementById('attendanceDate').value;
      const className = document.getElementById('classSelect').value;

      if (!selectedDate || !className) {
        alert('請先選擇日期與班級！');
        return;
      }

      const targetMonthStr = selectedDate.substring(0, 7); // e.g. "2026-09"

      try {
        // 從 Firebase 撈取該班級當月紀錄
        const snapshot = await db.collection('attendance')
          .where('className', '==', className)
          .where('month', '==', targetMonthStr)
          .get();

        if (snapshot.empty) {
          alert(`${targetMonthStr} 月份 ${className} 尚無任何點名紀錄！`);
          return;
        }

        // 轉換為行政學籍標準列資料
        const rows = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          const dateStr = data.date;
          if (data.absentDetails && data.absentDetails.length > 0) {
            data.absentDetails.forEach(student => {
              const seatNo = student.seatNo;
              const type = student.type || '事假';
              const periods = student.periods || [1,2,3,4,5,6,7];

              periods.forEach(p => {
                rows.push({
                  '班級': className,
                  '座號': seatNo,
                  '日期': dateStr,
                  '節次': `第${p}節`,
                  '假別': type
                });
              });
            });
          }
        });

        if (rows.length === 0) {
          alert(`${targetMonthStr} 月份 ${className} 全員全勤，無缺席紀錄！`);
          return;
        }

        // 排序：按日期、座號、節次
        rows.sort((a, b) => {
          if (a.日期 !== b.日期) return a.日期.localeCompare(b.日期);
          if (a.座號 !== b.座號) return a.座號 - b.座號;
          return a.節次.localeCompare(b.節次);
        });

        // 產生 Excel
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, `${className}缺勤紀錄`);

        // 設定欄寬
        ws['!cols'] = [
          { wch: 12 }, // 班級
          { wch: 8 },  // 座號
          { wch: 12 }, // 日期
          { wch: 10 }, // 節次
          { wch: 10 }  // 假別
        ];

        const fileName = `${targetMonthStr}_${className}_學生缺勤紀錄匯入檔.xlsx`;
        XLSX.writeFile(wb, fileName);

      } catch (err) {
        console.error("匯出 Excel 失敗:", err);
        alert('匯出失敗：' + err.message);
      }
    }
  </script>
</body>
</html>
