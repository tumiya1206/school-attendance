<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>民生國小 - 班級點名系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
    
    <!-- 頁首標題區 -->
    <div class="bg-blue-600 p-6 text-white text-center shadow-md">
      <div class="flex justify-center items-center gap-3 mb-2">
        <img src="https://www.msps.ptc.edu.tw/uploads/1711081122959z3rux6p2.png" alt="校徽" class="w-10 h-10 object-contain bg-white rounded-full p-1">
        <h1 class="text-xl font-black tracking-wide">屏東市民生國小 - 班級點名系統</h1>
      </div>
      <p class="text-xs text-blue-100 font-medium">每日出缺勤登記表（導師專用）</p>
    </div>

    <form id="attendanceForm" onsubmit="submitAttendance(event)" class="p-6 space-y-6">
      
      <!-- 基本資料選擇區 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">📅 點名日期</label>
          <input type="date" id="attDate" onchange="onDateOrClassChange()" required class="w-full p-2.5 border rounded-lg bg-white text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">🏫 選擇班級</label>
          <select id="attClass" onchange="onDateOrClassChange()" required class="w-full p-2.5 border rounded-lg bg-white text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">-- 請選擇班級 --</option>
            <option value="一年一班">一年一班</option>
            <option value="二年一班">二年一班</option>
            <option value="三年一班">三年一班</option>
            <option value="四年一班">四年一班</option>
            <option value="四年二班">四年二班</option>
            <option value="五年一班">五年一班</option>
            <option value="五年二班">五年二班</option>
            <option value="六年一班">六年一班</option>
            <option value="六年二班">六年二班</option>
          </select>
        </div>
      </div>

      <!-- 星期與節次提醒條 -->
      <div id="dayNotice" class="text-xs font-bold px-3 py-2 rounded-lg bg-blue-50 text-blue-700 border border-blue-200 flex items-center justify-between">
        <span>📅 當日前段點名設定已自動適應週課表</span>
        <span id="dayNoticeTag" class="bg-blue-600 text-white text-[11px] px-2 py-0.5 rounded">一般課表</span>
      </div>

      <!-- 人數資訊區 -->
      <div class="flex items-center justify-between bg-blue-50/50 p-4 rounded-xl border border-blue-100">
        <div>
          <span class="text-xs text-slate-500 block">班級應到人數</span>
          <input type="number" id="totalCount" value="25" min="1" required class="w-20 p-1.5 text-center font-bold text-slate-800 border rounded-md text-sm mt-0.5"> 人
        </div>
        <div class="text-right">
          <span class="text-xs text-slate-500 block">今日缺席人數</span>
          <span id="absentDisplayCount" class="text-xl font-black text-red-600">0</span> 人
        </div>
      </div>

      <!-- 缺席登記清單 -->
      <div>
        <div class="flex justify-between items-center mb-3">
          <label class="text-sm font-bold text-slate-700">📋 缺席學生與假別登記</label>
          <button type="button" onclick="addAbsentRow()" class="text-xs bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-1.5 rounded-lg shadow-sm transition">
            ➕ 新增缺席學生
          </button>
        </div>

        <div id="absentList" class="space-y-3">
          <!-- 缺席項目範本區域 -->
        </div>

        <p id="noAbsentText" class="text-xs text-slate-400 text-center py-6 border border-dashed rounded-xl bg-slate-50">
          全班全勤請直接按下下方「傳送點名紀錄」
        </p>
      </div>

      <!-- 送出按鈕 -->
      <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition text-sm">
        📤 傳送點名紀錄
      </button>
    </form>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBqdSFkDkjka6hewD9hEfY39KIErVonz1I",
      authDomain: "school-attendance-5c91c.firebaseapp.com",
      projectId: "school-attendance-5c91c",
      storageBucket: "school-attendance-5c91c.firebasestorage.app",
      messagingSenderId: "3254054266",
      appId: "1:3254054266:web:246cd39b057a916ebafac3",
      measurementId: "G-PRV1QQM6ML"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const periodNames = [
      "導師時間", "第1節", "第2節", "第3節", "第4節", 
      "午休", "第5節", "第6節", "第7節"
    ];

    let rowCounter = 0;

    // 取得台灣本地日期 YYYY-MM-DD
    function getTaiwanTodayStr() {
      const now = new Date();
      const offsetMs = now.getTimezoneOffset() * 60000;
      const localTime = new Date(now.getTime() - offsetMs);
      return localTime.toISOString().split('T')[0];
    }

    window.onload = function() {
      document.getElementById('attDate').value = getTaiwanTodayStr();
      updateDayLimits();
    };

    function onDateOrClassChange() {
      updateDayLimits();
      checkExistingAttendance();
    }

    // 💡 關鍵邏輯：依據日期（星期幾）限制開放節次
    function getValidPeriodsForDate(dateStr) {
      if (!dateStr) return [0,1,2,3,4,5,6,7,8];
      const d = new Date(dateStr + "T00:00:00");
      const day = d.getDay(); // 0:週日, 1:週一, 3:週三 ...

      if (day === 3) {
        // 週三半天：僅開放 0~4 節 (導師時間 ~ 第4節)
        return [0, 1, 2, 3, 4];
      } else if (day === 1) {
        // 週一：僅開放 0~7 節 (導師時間 ~ 第6節)
        return [0, 1, 2, 3, 4, 5, 6, 7];
      } else {
        // 週二、四、五：開放 0~8 節 (全天 9 個節次)
        return [0, 1, 2, 3, 4, 5, 6, 7, 8];
      }
    }

    // 更新提醒文字與刷新卡片節次開關
    function updateDayLimits() {
      const dateVal = document.getElementById('attDate').value;
      if (!dateVal) return;

      const d = new Date(dateVal + "T00:00:00");
      const day = d.getDay();
      const tag = document.getElementById('dayNoticeTag');

      if (day === 3) {
        tag.innerText = "週三半天（課表開放至第4節）";
        tag.className = "bg-orange-600 text-white text-[11px] px-2 py-0.5 rounded";
      } else if (day === 1) {
        tag.innerText = "週一課表（課表開放至第6節）";
        tag.className = "bg-blue-600 text-white text-[11px] px-2 py-0.5 rounded";
      } else {
        tag.innerText = "全天課表（開放至第7節）";
        tag.className = "bg-emerald-600 text-white text-[11px] px-2 py-0.5 rounded";
      }

      // 重新計算所有已新增項目的開關
      const validPeriods = getValidPeriodsForDate(dateVal);
      document.querySelectorAll('.absent-item').forEach(item => {
        const rowId = item.dataset.rowId;
        refreshPeriodButtons(rowId, validPeriods);
      });
    }

    // 新增缺席列
    function addAbsentRow(defaultData = null) {
      rowCounter++;
      const rowId = `row_${rowCounter}`;
      const list = document.getElementById('absentList');
      document.getElementById('noAbsentText').classList.add('hidden');

      const dateVal = document.getElementById('attDate').value;
      const validPeriods = getValidPeriodsForDate(dateVal);

      const div = document.createElement('div');
      div.className = "absent-item bg-red-50/50 border border-red-200 rounded-xl p-3.5 space-y-3 relative";
      div.dataset.rowId = rowId;

      let pButtonsHtml = periodNames.map((pName, idx) => {
        const isValid = validPeriods.includes(idx);
        const disAttr = isValid ? '' : 'disabled';
        const opacityClass = isValid ? '' : 'opacity-30 bg-slate-200 cursor-not-allowed border-slate-300 text-slate-400';

        return `<button type="button" 
                  data-period="${idx}" 
                  ${disAttr}
                  onclick="togglePeriod('${rowId}', ${idx})" 
                  class="period-btn-${rowId} text-[11px] border py-1 rounded font-semibold transition ${opacityClass} ${isValid ? 'border-slate-300 bg-white text-slate-600' : ''}">
                  ${pName}
                </button>`;
      }).join('');

      div.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-red-700">座號:</span>
            <input type="number" id="seat_${rowId}" min="1" max="50" required placeholder="座號" class="w-16 p-1.5 text-center text-sm border rounded font-bold">
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-red-700">假別:</span>
            <select id="type_${rowId}" class="p-1.5 text-xs border rounded bg-white font-bold text-slate-700">
              <option value="事假">事假</option>
              <option value="病假">病假</option>
              <option value="公假">公假</option>
              <option value="喪假">喪假</option>
              <option value="其它">其它</option>
            </select>
          </div>
          <button type="button" onclick="removeRow('${rowId}')" class="text-red-500 hover:text-red-700 text-xs font-bold px-2 py-1">
            ✕ 刪除
          </button>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <span class="text-[11px] font-bold text-slate-500">請假節次選擇：</span>
            <button type="button" onclick="selectAllPeriods('${rowId}')" class="text-[11px] text-blue-600 font-bold hover:underline">
              ✓ 當日全選（全天）
            </button>
          </div>
          <div class="grid grid-cols-3 md:grid-cols-5 gap-1.5">
            ${pButtonsHtml}
          </div>
        </div>
      `;

      list.appendChild(div);

      if (defaultData) {
        document.getElementById(`seat_${rowId}`).value = defaultData.seatNo;
        document.getElementById(`type_${rowId}`).value = defaultData.type;
        if (defaultData.periods) {
          defaultData.periods.forEach(pIdx => {
            if (validPeriods.includes(pIdx)) {
              togglePeriod(rowId, pIdx, true);
            }
          });
        }
      }

      updateAbsentCount();
    }

    // 當日期變更時，自動更新已開節次的關閉狀態
    function refreshPeriodButtons(rowId, validPeriods) {
      const btns = document.querySelectorAll(`.period-btn-${rowId}`);
      btns.forEach((btn) => {
        const pIdx = parseInt(btn.dataset.period);
        const isValid = validPeriods.includes(pIdx);

        if (!isValid) {
          btn.disabled = true;
          btn.className = `period-btn-${rowId} text-[11px] border py-1 rounded font-semibold transition opacity-30 bg-slate-200 cursor-not-allowed border-slate-300 text-slate-400`;
        } else if (!btn.classList.contains('bg-red-600')) {
          btn.disabled = false;
          btn.className = `period-btn-${rowId} text-[11px] border py-1 rounded font-semibold transition border-slate-300 bg-white text-slate-600`;
        }
      });
    }

    // 切換節次選擇狀態
    function togglePeriod(rowId, periodIdx, forceState = null) {
      const dateVal = document.getElementById('attDate').value;
      const validPeriods = getValidPeriodsForDate(dateVal);
      if (!validPeriods.includes(periodIdx)) return; // 禁選的節次不處理

      const btns = document.querySelectorAll(`.period-btn-${rowId}`);
      btns.forEach(btn => {
        if (parseInt(btn.dataset.period) === periodIdx) {
          const isSelected = forceState !== null ? forceState : !btn.classList.contains('bg-red-600');
          if (isSelected) {
            btn.className = `period-btn-${rowId} text-[11px] border py-1 rounded font-semibold transition bg-red-600 border-red-600 text-white shadow-sm`;
          } else {
            btn.className = `period-btn-${rowId} text-[11px] border py-1 rounded font-semibold transition border-slate-300 bg-white text-slate-600`;
          }
        }
      });
    }

    // 全選（僅選擇當天有課的節次）
    function selectAllPeriods(rowId) {
      const dateVal = document.getElementById('attDate').value;
      const validPeriods = getValidPeriodsForDate(dateVal);

      validPeriods.forEach(pIdx => {
        togglePeriod(rowId, pIdx, true);
      });
    }

    // 刪除列
    function removeRow(rowId) {
      const row = document.querySelector(`[data-row-id="${rowId}"]`);
      if (row) row.remove();

      const list = document.getElementById('absentList');
      if (list.children.length === 0) {
        document.getElementById('noAbsentText').classList.remove('hidden');
      }
      updateAbsentCount();
    }

    // 計算缺席人數
    function updateAbsentCount() {
      const items = document.querySelectorAll('.absent-item');
      document.getElementById('absentDisplayCount').innerText = items.length;
    }

    // 檢查資料庫是否已有點名紀錄（編輯用）
    async function checkExistingAttendance() {
      const dateVal = document.getElementById('attDate').value;
      const classVal = document.getElementById('attClass').value;

      if (!dateVal || !classVal) return;

      try {
        const docRef = db.collection('attendance').doc(`${dateVal}_${classVal}`);
        const docSnap = await docRef.get();

        document.getElementById('absentList').innerHTML = '';
        document.getElementById('noAbsentText').classList.remove('hidden');

        if (docSnap.exists) {
          const data = docSnap.data();
          if (data.totalCount) document.getElementById('totalCount').value = data.totalCount;

          if (data.absentDetails && data.absentDetails.length > 0) {
            data.absentDetails.forEach(detail => addAbsentRow(detail));
          }
        }
        updateAbsentCount();
      } catch (err) {
        console.error("讀取舊紀錄失敗：", err);
      }
    }

    // 送出點名紀錄
    async function submitAttendance(e) {
      e.preventDefault();

      const dateVal = document.getElementById('attDate').value;
      const classVal = document.getElementById('attClass').value;
      const totalCount = parseInt(document.getElementById('totalCount').value) || 0;
      const monthVal = dateVal.substring(0, 7);

      if (!dateVal || !classVal) {
        alert('請填寫完整日期與班級！');
        return;
      }

      const validPeriods = getValidPeriodsForDate(dateVal);
      const absentItems = document.querySelectorAll('.absent-item');
      const absentDetails = [];

      for (let item of absentItems) {
        const rowId = item.dataset.rowId;
        const seatNo = parseInt(document.getElementById(`seat_${rowId}`).value);
        const type = document.getElementById(`type_${rowId}`).value;

        const selectedPeriods = [];
        const btns = document.querySelectorAll(`.period-btn-${rowId}`);
        btns.forEach(btn => {
          const pIdx = parseInt(btn.dataset.period);
          if (btn.classList.contains('bg-red-600') && validPeriods.includes(pIdx)) {
            selectedPeriods.push(pIdx);
          }
        });

        if (!seatNo) {
          alert('有請假項目的座號未填寫！');
          return;
        }

        if (selectedPeriods.length === 0) {
          alert(`${seatNo} 號未選擇任何請假節次！`);
          return;
        }

        absentDetails.push({
          seatNo: seatNo,
          type: type,
          periods: selectedPeriods
        });
      }

      const absentCount = absentDetails.length;
      const presentCount = totalCount - absentCount;

      const payload = {
        date: dateVal,
        month: monthVal,
        className: classVal,
        totalCount: totalCount,
        presentCount: presentCount,
        absentCount: absentCount,
        absentDetails: absentDetails,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = '傳送中...';

      try {
        await db.collection('attendance').doc(`${dateVal}_${classVal}`).set(payload);
        alert(`【${classVal}】 ${dateVal} 出缺勤紀錄傳送成功！`);
      } catch (err) {
        console.error("傳送失敗：", err);
        alert('傳送失敗：' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '📤 傳送點名紀錄';
      }
    }
  </script>
</body>
</html>
