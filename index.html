<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全校晨間點名系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 注意：請替換成你原本 Firebase 的配置資訊
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.submitAttendance = async function() {
      const className = document.getElementById('className').value;
      const totalStudents = parseInt(document.getElementById('totalStudents').value) || 0;
      const absentInfo = document.getElementById('absentInfo').value.trim();

      if (!className) {
        alert('請選擇班級！');
        return;
      }

      // 取得今天日期 YYYY-MM-DD
      const today = new Date();
      const dateStr = today.toISOString().split('T')[0];
      const monthStr = dateStr.substring(0, 7); // YYYY-MM

      const docId = `${dateStr}_${className}`;

      try {
        await setDoc(docDoc(db, "attendance", docId), {
          date: dateStr,
          month: monthStr,
          className: className,
          totalStudents: totalStudents,
          absentInfo: absentInfo,
          updatedAt: serverTimestamp()
        });

        alert(`【${className}】${dateStr} 晨間點名成功送出！`);
        document.getElementById('absentInfo').value = '';
      } catch (e) {
        console.error("Error writing document: ", e);
        alert("儲存失敗，請檢查網路連線或聯繫系統管理員。");
      }
    };
  </script>
</head>
<body class="bg-slate-100 p-4 font-sans max-w-md mx-auto min-h-screen">
  <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
    <h1 class="text-2xl font-bold text-slate-800 text-center mb-6">全校晨間點名</h1>
    
    <div class="mb-4">
      <label class="block text-slate-700 font-semibold mb-2">班級</label>
      <select id="className" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 text-lg">
        <option value="">-- 請選擇班級 --</option>
        <option value="一年一班">一年一班</option>
        <option value="一年二班">一年二班</option>
        <option value="二年一班">二年一班</option>
        <option value="二年二班">二年二班</option>
        <option value="三年一班">三年一班</option>
        <option value="三年二班">三年二班</option>
        <option value="四年一班">四年一班</option>
        <option value="四年二班">四年二班</option>
        <option value="五年一班">五年一班</option>
        <option value="五年二班">五年二班</option>
        <option value="六年一班">六年一班</option>
        <option value="六年二班">六年二班</option>
      </select>
    </div>

    <div class="mb-4">
      <label class="block text-slate-700 font-semibold mb-2">班級應到人數</label>
      <input type="number" id="totalStudents" value="25" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 text-lg">
    </div>

    <div class="mb-6">
      <label class="block text-slate-700 font-semibold mb-2">缺席座號與原因（若全到請留空）</label>
      <textarea id="absentInfo" rows="4" placeholder="例如：5號病假、12號事假" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 text-lg"></textarea>
    </div>

    <button onclick="submitAttendance()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition duration-200 text-lg">
      提交今日點名紀錄
    </button>
  </div>
</body>
</html>
